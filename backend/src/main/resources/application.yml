spring:
  application:
    name: review-tap
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/reviewtap}
    username: ${DATABASE_USER:reviewtap}
    password: ${DATABASE_PASSWORD:reviewtap}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  mail:
    # Sin SMTP_HOST no se crea JavaMailSender y el "olvidé mi contraseña" sólo deja traza en el log.
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000

server:
  port: 8080
  # Detrás de Nginx / NPM. `native` = RemoteIpValve de Tomcat: recorre X-Forwarded-For desde la
  # derecha saltando proxies internos (rangos privados), así que un valor falsificado por el cliente
  # nunca se toma como su IP. (`framework` usa el PRIMER valor, que es spoofeable.)
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Proxies adicionales de confianza (regex) si el reverse proxy no está en una red privada.
      trusted-proxies: ${TRUSTED_PROXIES:}
  error:
    include-stacktrace: never
    include-message: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui
    enabled: ${SWAGGER_UI_ENABLED:true}

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  # URL pública del panel (enlaces en los emails), sin barra final.
  app-base-url: ${APP_BASE_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl: ${JWT_TTL:PT8H}
    cookie-name: rt_session
    cookie-secure: ${COOKIE_SECURE:true}
    login-max-attempts: 8
    login-lockout: PT15M
  interactions:
    dedupe-window: ${INTERACTION_DEDUPE_WINDOW:PT60S}
    client-rate-limit: ${INTERACTION_CLIENT_RATE_LIMIT:40}
    client-rate-window: PT10M
  bootstrap:
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    com.reviewtap: INFO
