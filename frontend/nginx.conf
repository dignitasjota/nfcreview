# Sirve la SPA y proxifica /api al backend (mismo origen → la cookie de sesión no cruza dominios).
# BACKEND_URL se sustituye en el arranque (nginx envsubst sobre /etc/nginx/templates).

# Esquema visto por el cliente: el del reverse proxy externo si lo indica, si no el nuestro.
map $http_x_forwarded_proto $client_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Puerto que ve el navegador: el del Host original (coincide con el de la cabecera Origin).
map $http_host $client_port {
    default        $server_port;
    "~:(?<p>\d+)$" $p;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # ^~ : prefijo prioritario sobre las location regex de assets (evita que /api/.../qr.png las capture).
    location ^~ /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        # Host CON puerto: Spring compara Origin con Host para decidir si una petición es cross-origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $client_port;
        proxy_read_timeout 60s;
    }

    # Assets con hash: cache larga. index.html nunca se cachea (despliegues sin recarga forzada).
    location ~* \.(?:js|css|svg|png|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
    }
}
