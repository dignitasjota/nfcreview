# Cabeceras de seguridad. nginx no hereda add_header cuando una location define el suyo,
# por eso este fichero se incluye en el server y en cada location con add_header propio.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Angular inyecta los estilos de componente como <style> → style-src necesita 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# El panel es privado: que no lo indexen.
add_header X-Robots-Tag "noindex, nofollow" always;
