# ReviewTap — stack completo. Copia .env.example a .env y ajusta valores antes de `docker compose up -d`.
# Backup diario opcional: `docker compose --profile backup up -d` (ver servicio `backup`).

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reviewtap}
      POSTGRES_USER: ${POSTGRES_USER:-reviewtap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reviewtap} -d ${POSTGRES_DB:-reviewtap}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build: ./backend
    image: reviewtap-backend:latest
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reviewtap}
      DATABASE_USER: ${POSTGRES_USER:-reviewtap}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (openssl rand -base64 48)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Define PUBLIC_BASE_URL en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      SWAGGER_UI_ENABLED: ${SWAGGER_UI_ENABLED:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      APP_BASE_URL: ${APP_BASE_URL:?Define APP_BASE_URL en .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:-}
    ports:
      # Expuesto sólo en localhost: el reverse proxy (NPM/Nginx) enruta r.midominio.com → :8080.
      - "${BACKEND_PORT:-127.0.0.1:8080}:8080"
    networks: [internal, proxy]

  frontend:
    build: ./frontend
    image: reviewtap-frontend:latest
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      # El reverse proxy enruta app.midominio.com → :8081.
      - "${FRONTEND_PORT:-127.0.0.1:8081}:8080"
    networks: [internal, proxy]

  landing:
    build: ./landing
    image: reviewtap-landing:latest
    restart: unless-stopped
    logging: *logging
    ports:
      # Web pública de venta: el reverse proxy enruta midominio.com / www.midominio.com → :8082.
      - "${LANDING_PORT:-127.0.0.1:8082}:8080"
    networks: [proxy]

  # Backup diario de PostgreSQL (pg_dump + gzip) con retención. Sólo con `--profile backup`.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: [backup]
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-reviewtap}
      PGUSER: ${POSTGRES_USER:-reviewtap}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/reviewtap-$$(date +%F-%H%M).sql.gz
          if pg_dump --no-owner | gzip > "$$f"; then echo "backup OK $$f"; else echo "backup FAILED"; rm -f "$$f"; fi
          find /backups -name 'reviewtap-*.sql.gz' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep 86400
        done
    networks: [internal]

volumes:
  pgdata:
  backups:

networks:
  internal:
  # Red compartida con Nginx Proxy Manager si corre en el mismo host (docker network create proxy).
  proxy:
    name: ${PROXY_NETWORK:-reviewtap-proxy}
